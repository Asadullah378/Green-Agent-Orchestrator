# ============================================================================
# Experiment 04 — Qwen 3.5 via llama.cpp (instead of Ollama)
# ============================================================================
# Same model lineup as experiment 01 (122B homo, 2B/4B/9B hetero pool), but
# the inference backend is `llama.cpp` via `llama-swap`.
#
# Model aliases below must match the entries in:
#     configs/experiments/04_qwen3.5_llamacpp.swap.yaml
#
# One-time setup:
#   1. brew install llama.cpp llama-swap
#   2. Download Qwen 3.5 GGUF checkpoints to ~/models/qwen3.5/:
#        qwen3.5-2b-instruct-q4_k_m.gguf
#        qwen3.5-4b-instruct-q4_k_m.gguf
#        qwen3.5-9b-instruct-q4_k_m.gguf
#        qwen3.5-122b-instruct-q4_k_m.gguf
#   3. Start the proxy in a separate terminal:
#        llama-swap --config configs/experiments/04_qwen3.5_llamacpp.swap.yaml --listen :8080
#   4. Run the experiment:
#        python -m src.run_experiment --config configs/experiments/04_qwen3.5_llamacpp.yaml
# ============================================================================

experiment:
  name: "04_qwen3.5_llamacpp"
  num_runs: 7
  results_dir: "results/04_qwen3.5_llamacpp"

llm:
  provider: "llamacpp"
  request_timeout: 1200
  temperature: 0.0
  reasoning: false

  ollama:
    base_url: "http://localhost:11434"

  llamacpp:
    base_url: "http://localhost:8080/v1"
    api_key: "no-key"

energy:
  country_iso_code: "FIN"
  log_level: "error"
  tracking_mode: "process"

homogeneous:
  model: "qwen3.5-122b"           # alias declared in the matching llama-swap config
  size_b: 122
  max_agent_steps: 40

heterogeneous:
  orchestrator:
    model: "qwen3.5-4b"
    size_b: 4

  synthesizer:
    model: "qwen3.5-2b"
    size_b: 2

  workers:
    - tier: "small"
      model: "qwen3.5-2b"
      size_b: 2
      max_steps: 10
      description: "Simple subtasks — 1 to 2 total tool invocations."
    - tier: "medium"
      model: "qwen3.5-4b"
      size_b: 4
      max_steps: 15
      description: "Moderate subtasks — 3 to 5 tool invocations or multi-step math."
    - tier: "large"
      model: "qwen3.5-9b"
      size_b: 9
      max_steps: 25
      description: "Complex subtasks — 6 or more tool invocations or advanced reasoning."

  difficulty_to_tier:
    easy: "small"
    medium: "medium"
    hard: "large"

  routing_safety:
    enabled: true
    from_tier: "small"
    to_tier: "medium"
    min_complexity_keywords: 3
    max_description_length: 160
    complexity_keywords:
      - calculate
      - compute
      - find
      - compare
      - convert
      - determine
      - identify
      - analyse
      - analyze
      - average
      - sum
      - total
      - growth
      - rate
      - difference

  decomposition:
    min_subtasks: 1
    max_subtasks: 4
