# ============================================================================
# Experiment 06 — Gemma 3 family
# ============================================================================
# Cross-architecture replication using Google's Gemma 3 models.
#
# Pull the models before running:
#   ollama pull gemma3:27b
#   ollama pull gemma3:270m
#   ollama pull gemma3:1b
#   ollama pull gemma3:4b
#
# Run:
#   python -m src.run_experiment --config configs/experiments/06_gemma4.yaml
# ============================================================================

experiment:
  name: "06_gemma4"
  num_runs: 7
  results_dir: "results/06_gemma4"

llm:
  provider: "ollama"
  request_timeout: 360
  temperature: 0.0
  reasoning: false

  ollama:
    base_url: "http://localhost:11434"

  llamacpp:
    base_url: "http://localhost:8080/v1"
    api_key: "no-key"

energy:
  country_iso_code: "FIN"
  log_level: "error"
  tracking_mode: "process"

homogeneous:
  model: "gemma3:27b"
  size_b: 27
  max_agent_steps: 40

heterogeneous:
  orchestrator:
    model: "gemma3:4b"
    size_b: 4

  synthesizer:
    model: "gemma3:270m"
    size_b: 1                    # ~270M params (stored as 1B for int size_b field)

  workers:
    - tier: "small"
      model: "gemma3:270m"
      size_b: 1
      max_steps: 10
      description: "Simple subtasks — 1 to 2 total tool invocations."
    - tier: "medium"
      model: "gemma3:1b"
      size_b: 1
      max_steps: 15
      description: "Moderate subtasks — 3 to 5 tool invocations or multi-step math."
    - tier: "large"
      model: "gemma3:4b"
      size_b: 4
      max_steps: 25
      description: "Complex subtasks — 6 or more tool invocations or advanced reasoning."

  difficulty_to_tier:
    easy: "small"
    medium: "medium"
    hard: "large"

  routing_safety:
    enabled: true
    from_tier: "small"
    to_tier: "medium"
    min_complexity_keywords: 3
    max_description_length: 160
    complexity_keywords:
      - calculate
      - compute
      - find
      - compare
      - convert
      - determine
      - identify
      - analyse
      - analyze
      - average
      - sum
      - total
      - growth
      - rate
      - difference

  decomposition:
    min_subtasks: 1
    max_subtasks: 4
