# ============================================================================
# Experiment 06 — DeepSeek R1 family
# ============================================================================
# Cross-architecture replication using DeepSeek R1 models.
#
# Pull the models before running:
#   ollama pull deepseek-r1:70b
#   ollama pull deepseek-r1:1.5b
#   ollama pull deepseek-r1:7b
#   ollama pull deepseek-r1:8b
#
# Run:
#   python -m src.run_experiment --config configs/experiments/06_deepseek_r1.yaml
# ============================================================================

experiment:
  name: "06_deepseek_r1"
  num_runs: 7
  results_dir: "results/06_deepseek_r1"

llm:
  provider: "ollama"
  request_timeout: 600
  temperature: 0.0
  reasoning: false

  ollama:
    base_url: "http://localhost:11434"

  llamacpp:
    base_url: "http://localhost:8080/v1"
    api_key: "no-key"

energy:
  country_iso_code: "FIN"
  log_level: "error"
  tracking_mode: "process"

homogeneous:
  model: "deepseek-r1:70b"
  size_b: 70
  max_agent_steps: 40

heterogeneous:
  orchestrator:
    model: "deepseek-r1:8b"
    size_b: 8

  synthesizer:
    model: "deepseek-r1:1.5b"
    size_b: 1

  workers:
    - tier: "small"
      model: "deepseek-r1:1.5b"
      size_b: 1
      max_steps: 10
      description: "Simple subtasks — 1 to 2 total tool invocations."
    - tier: "medium"
      model: "deepseek-r1:7b"
      size_b: 7
      max_steps: 15
      description: "Moderate subtasks — 3 to 5 tool invocations or multi-step math."
    - tier: "large"
      model: "deepseek-r1:8b"
      size_b: 8
      max_steps: 25
      description: "Complex subtasks — 6 or more tool invocations or advanced reasoning."

  difficulty_to_tier:
    easy: "small"
    medium: "medium"
    hard: "large"

  routing_safety:
    enabled: true
    from_tier: "small"
    to_tier: "medium"
    min_complexity_keywords: 3
    max_description_length: 160
    complexity_keywords:
      - calculate
      - compute
      - find
      - compare
      - convert
      - determine
      - identify
      - analyse
      - analyze
      - average
      - sum
      - total
      - growth
      - rate
      - difference

  decomposition:
    min_subtasks: 1
    max_subtasks: 4
